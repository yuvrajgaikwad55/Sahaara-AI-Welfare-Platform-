version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://sahaara:password@postgres:5432/sahaara
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: python app.py

  frontend:
    build:
      context: ./website
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./website:/app
    command: python -m http.server 8000

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=sahaara
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=sahaara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
